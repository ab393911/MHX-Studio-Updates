name: Windows x64 tests and preview release

on:
  push:
    branches: [main, codex/mhx-studio-recovery, codex/mhx-remove-nine-20261029, codex/mhx-group-login-20261030, codex/mhx-startup-flow-20261030]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mhx-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/mhx-remove-nine-20261029' || github.ref == 'refs/heads/codex/mhx-group-login-20261030' || github.ref == 'refs/heads/codex/mhx-startup-flow-20261030' }}

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the user-verified preview.19 foundation and launch implementation
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 4089802dcfa41d7d352f66da031d234a8d2b836b
          if ($LASTEXITCODE) { throw 'Cannot fetch accepted emulator source baseline' }
          git diff --exit-code 4089802dcfa41d7d352f66da031d234a8d2b836b HEAD -- internal/ldplayer internal/gameapp internal/update/transaction.go internal/update/manifest.go internal/automation/engine.go internal/automation/profile.go cmd/mhxstudio/runtime_windows.go cmd/mhxstudio/update_status_windows.go cmd/mhxstudio/emulators_windows.go cmd/mhxstudio/discovery_store.go
          if ($LASTEXITCODE) { throw 'Accepted foundation was changed beyond the isolated handoff additions' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: go vet ./...
      - name: Verify native Windows OCR bridge
        run: go test -count=1 -v -run '^TestNativeWindowsOCR' ./internal/vision
        env:
          MHX_OCR_REPORT: ${{ github.workspace }}\dist\native-ocr-capability.json
      - run: go test -count=1 -skip '^TestNativeWindowsOCR' ./...
      - name: Build Windows x64 GUI and previous-version test binary
        id: build
        shell: pwsh
        run: |
          $version = "3.5.0-preview.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$version -X main.sourceCommit=$env:GITHUB_SHA" -o dist/MHXStudio.exe ./cmd/mhxstudio
          if ($LASTEXITCODE) { throw 'Main EXE build failed' }
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=3.4.999 -X main.sourceCommit=$env:GITHUB_SHA" -o dist/old-test.exe ./cmd/mhxstudio
          if ($LASTEXITCODE) { throw 'Test EXE build failed' }
          go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/exit-test.exe ./cmd/testexit
          if ($LASTEXITCODE) { throw 'Exit fixture build failed' }
          go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/ldfixture.exe ./cmd/ldfixture
          if ($LASTEXITCODE) { throw 'LDPlayer CLI fixture build failed' }
      - name: Download immutable published baselines for direct upgrade tests
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v3.5.0-preview.19/MHXStudio.exe' -OutFile dist/published19.exe
          if ((Get-FileHash dist/published19.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ab2fb36814a87d375dc3b45490eabefd81bae1d73a0390a9b2553b9044db9b16') { throw 'preview.19 baseline hash mismatch' }
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v3.5.0-preview.21/MHXStudio.exe' -OutFile dist/published21.exe
          if ((Get-FileHash dist/published21.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b8c5d2c7bace05be05a332cba6afbc584600adee011635af6d509104aec05aa8') { throw 'preview.21 baseline hash mismatch' }
      - name: Run native GUI, real EXE replacement and rollback tests
        shell: pwsh
        run: |
          go run ./cmd/windowsverify -old "$pwd/dist/old-test.exe" -new "$pwd/dist/MHXStudio.exe" -exit-fixture "$pwd/dist/exit-test.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '${{ steps.build.outputs.version }}' -published19 "$pwd/dist/published19.exe" -published21 "$pwd/dist/published21.exe" -out dist/windows-tests.json
          if ($LASTEXITCODE) { throw 'Native Windows tests failed' }
      - name: Package verified preview
        shell: pwsh
        run: |
          go run ./cmd/release -exe dist/MHXStudio.exe -version '${{ steps.build.outputs.version }}' -commit $env:GITHUB_SHA -report dist/windows-tests.json
          if ($LASTEXITCODE) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MHXStudio-Windows-x64
          path: |
            dist/MHXStudio.exe
            dist/MHXStudio-Windows-x64.zip
            dist/update.json
            dist/SHA256SUMS.txt
            dist/windows-tests.json
            dist/native-ocr-capability.json
            dist/numeric-ocr-failure.png
            dist/emulator-gui-preview.png
            dist/adb-fallback-gui-preview.png
            dist/single-game-gui-preview.png
            dist/calibration-gui-preview.png
            dist/studio-gui-preview.png
            dist/group-login-gui-preview.png
            dist/delivery-ledger-gui-preview.png
            dist/on-open-settings-gui-preview.png
            dist/on-open-running-gui-preview.png
            dist/preview19-direct/
            dist/preview21-migration/
            dist/old-test.exe
            dist/ldfixture.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/mhx-studio-recovery' || startsWith(github.ref, 'refs/tags/v'))
    needs: [portable-tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: MHXStudio-Windows-x64
          path: dist
      - name: Publish preview candidate and anonymously verify bytes
        env:
          GH_TOKEN: ${{ github.token }}
          MHX_VERSION: ${{ needs.windows.outputs.version }}
        run: bash scripts/publish-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anonymous-download-verification
          path: dist/download-verification.json
          if-no-files-found: ignore

  live-gui-update:
    needs: [publish, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: MHXStudio-Windows-x64
          path: verification
      - name: Exercise the published previous EXE against the candidate manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v3.5.0-preview.19/MHXStudio.exe' -OutFile dist/previous-release.exe
          if ((Get-FileHash dist/previous-release.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ab2fb36814a87d375dc3b45490eabefd81bae1d73a0390a9b2553b9044db9b16') { throw 'Published baseline SHA-256 mismatch' }
          go run ./cmd/windowsverify -old "$pwd/dist/previous-release.exe" -old-version '3.5.0-preview.19' -expect-one-click -live-update 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v${{ needs.windows.outputs.version }}/update.json' -version '${{ needs.windows.outputs.version }}' -emulator-fixture "$pwd/verification/ldfixture.exe" -out dist/live-gui-update.json
          if ($LASTEXITCODE) { throw 'Live GUI update test failed' }
      - name: Verify the new updater requires exactly one click and no confirmation
        shell: pwsh
        run: |
          go run ./cmd/windowsverify -old "$pwd/verification/old-test.exe" -old-version '3.4.999' -expect-one-click -live-update 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v${{ needs.windows.outputs.version }}/update.json' -version '${{ needs.windows.outputs.version }}' -emulator-fixture "$pwd/verification/ldfixture.exe" -out dist/one-click-gui-update.json
          if ($LASTEXITCODE) { throw 'One-click GUI update test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-gui-update-verification
          path: |
            dist/live-gui-update.json
            dist/one-click-gui-update.json
            dist/legacy-before.png
            dist/legacy-after.png
            dist/one-click-before.png
            dist/one-click-after.png
            dist/published-before.png
            dist/published-after.png
          if-no-files-found: ignore

  promote-channel:
    needs: [publish, windows, live-gui-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: MHXStudio-Windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: live-gui-update-verification
          path: dist
      - name: Advance channel only after the real GUI update passes
        env:
          GH_TOKEN: ${{ github.token }}
          MHX_VERSION: ${{ needs.windows.outputs.version }}
        run: bash scripts/promote-channel.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promoted-channel-verification
          path: dist/download-verification.json
          if-no-files-found: error
