name: Issue2 preview40 update verification (no publication)
on:
  push:
    branches: [codex/fix-preview40-bindings-adb, codex/recognition-diagnostics-20261102, codex/windows-image-display-20261103]
    paths:
      - '.github/workflows/issue2-update-test.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/issue2-ci-evidence.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue2-update-verification
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 -json ./... > portable-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2-portable-results
          path: portable-tests.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify unchanged database schema and build native candidate
        shell: pwsh
        run: |
          git fetch --no-tags origin bfc5e2f0336ede93e963d364cac21fb1a2f15a43
          if ($LASTEXITCODE) { throw 'Cannot read published source' }
          git diff --exit-code bfc5e2f0336ede93e963d364cac21fb1a2f15a43 HEAD -- internal/studio
          if ($LASTEXITCODE) { throw 'Database schema changed; explicit migration acceptance required' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          $version = '3.5.0-preview.41-issue2.3-gui.1'
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$version -X main.sourceCommit=$env:GITHUB_SHA" -o dist/MHXStudio.exe ./cmd/mhxstudio
          if ($LASTEXITCODE) { throw 'Candidate build failed' }
          go build -trimpath -ldflags '-H windowsgui -s -w' -o dist/exit-test.exe ./cmd/testexit
          if ($LASTEXITCODE) { throw 'Exit fixture build failed' }
          go build -trimpath -ldflags '-H windowsgui -s -w' -o dist/ldfixture.exe ./cmd/ldfixture
          if ($LASTEXITCODE) { throw 'Emulator fixture build failed' }
          go build -o dist/windowsverify.exe ./cmd/windowsverify
          if ($LASTEXITCODE) { throw 'Native verifier build failed' }
          $hash = (Get-FileHash dist/MHXStudio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version;source_commit=$env:GITHUB_SHA;sha256=$hash;size=(Get-Item dist/MHXStudio.exe).Length;isolated_test_id='';published=$false} | ConvertTo-Json | Set-Content -Encoding utf8 dist/candidate.json
      - name: Verify published preview40 baseline
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v3.5.0-preview.40/MHXStudio.exe' -OutFile dist/published40.exe
          if ((Get-FileHash dist/published40.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e58eaef41b4e37361f79cc500872bc89f1e7ebe37d810785740b294eb397daa2') { throw 'Published preview40 SHA mismatch' }
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/issue2-v3.5.0-preview.41-issue2.1/MHXStudio.exe' -OutFile dist/published41.exe
          if ((Get-FileHash dist/published41.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b7ac42b0800b96c4dd60a4245e31ebf054373675ae23702af4bb7ba978bf3cb7') { throw 'Published preview41 Issue2 SHA mismatch' }
      - name: Record published image baseline on actual screen pixels
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/issue2-v3.5.0-preview.41-issue2.2/MHXStudio.exe' -OutFile dist/published2.exe
          if ((Get-FileHash dist/published2.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '28a5f525f9df3c04d53818dc561cde21765c3850f7f3c5aea9182566daebd9a7') { throw 'Published issue2.2 SHA mismatch' }
          New-Item -ItemType Directory -Force dist/display-baseline | Out-Null
          ./dist/windowsverify.exe -recognition-only -display-probe -new "$pwd/dist/published2.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.2' -out dist/display-baseline/recognition-tests.json 2>&1 | Tee-Object -FilePath dist/display-baseline/baseline.log
          $baselineExit = $LASTEXITCODE
          Stop-Process -Name published2,dnplayer,adb,ldconsole -Force -ErrorAction SilentlyContinue
          $log = Get-Content dist/display-baseline/baseline.log -Raw
          $pixelFailure = $baselineExit -ne 0 -and $log -match '(calibration|original) [a-z0-9-]+: screen pixel mismatch'
          if ($baselineExit -ne 0 -and -not $pixelFailure) { throw 'Old baseline failed outside image pixel checks; inspect evidence' }
          @{reproduced=$pixelFailure;baseline_passed_on_ci=($baselineExit -eq 0);exit=$baselineExit;source_commit='25b5adcad0221cd3f6e1c90d569b8006ea4ebcc7';injection='RedrawWindow erase-now followed by normal message-loop repaint';exact_user_trigger_confirmed=$false} | ConvertTo-Json | Set-Content -Encoding utf8 dist/display-baseline/baseline-display.json
          $global:LASTEXITCODE = 0
      - name: Real GUI calibration save, pixel mapping, reload and read-only recognition
        id: recognition
        shell: pwsh
        run: |
          ./dist/windowsverify.exe -recognition-only -display-probe -new "$pwd/dist/MHXStudio.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.3-gui.1' -out dist/recognition-tests.json 2>&1 | Tee-Object -FilePath dist/recognition.log
          $recognitionExit = $LASTEXITCODE
          if ($recognitionExit) { throw 'Calibration/recognition regression failed; publication remains blocked' }
      - name: Actual Windows desktop PNG display lifecycle and full pixel comparison
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/desktop-png | Out-Null
          ./dist/windowsverify.exe -recognition-only -display-probe -screen-png -new "$pwd/dist/MHXStudio.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.3-gui.1' -out dist/desktop-png/recognition-tests.json 2>&1 | Tee-Object -FilePath dist/desktop-png/recognition.log
          if ($LASTEXITCODE) { throw 'Actual PNG onscreen rendering regression failed' }
      - name: Native Windows static checks and unit tests
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE) { throw 'Windows vet failed' }
          go test -p 1 -count=1 -json -skip '^TestNativeWindowsAssetAmounts$' ./... > dist/windows-unit-tests.json
          if ($LASTEXITCODE) { throw 'Windows unit tests failed (experimental game currency fixture was not run)' }
      - name: Native GUI, preview40 helper, backups, rollback and interruption
        if: ${{ !cancelled() && steps.recognition.outcome == 'success' }}
        shell: pwsh
        run: |
          ./dist/windowsverify.exe -old "$pwd/dist/published40.exe" -old-version '3.5.0-preview.40' -new "$pwd/dist/MHXStudio.exe" -exit-fixture "$pwd/dist/exit-test.exe" -version '3.5.0-preview.41-issue2.3-gui.1' -update-only -published40 "$pwd/dist/published40.exe" -published41 "$pwd/dist/published41.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -out dist/issue2-native-update.json 2>&1 | Tee-Object -FilePath dist/native-update.log
          $verifyExit = $LASTEXITCODE
          if ($verifyExit) { throw 'Native update acceptance failed; publication blocked' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2-windows-results
          path: |
            dist/candidate.json
            dist/windows-unit-tests.json
            dist/issue2-native-update.json
            dist/native-update.log
            dist/recognition-tests.json
            dist/recognition-export.zip
            dist/recognition.log
            dist/calibration-roundtrip.png
            dist/diagnostic-original-view.png
            dist/*-screen-*.png
            dist/display-baseline/
            dist/desktop-png/
            dist/preview40-direct/
            dist/preview41-issue2/
            dist/MHXStudio.exe
          if-no-files-found: error
      - name: Publish execution summary only
        if: always()
        shell: pwsh
        run: |
          "## Issue2 Windows verification" >> $env:GITHUB_STEP_SUMMARY
          foreach ($name in @('candidate.json','issue2-native-update.json','preview40-direct/upgrade.json')) {
            if (Test-Path "dist/$name") { "### $name" >> $env:GITHUB_STEP_SUMMARY; '```json' >> $env:GITHUB_STEP_SUMMARY; Get-Content "dist/$name" >> $env:GITHUB_STEP_SUMMARY; '```' >> $env:GITHUB_STEP_SUMMARY }
          }
  evidence:
    concurrency:
      group: issue2-evidence-writer
      cancel-in-progress: false
    if: always()
    needs: [portable, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: verification-artifacts
      - name: Persist reports only (no releases or channel changes)
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/issue2-ci-evidence.py

  windows-evidence:
    concurrency:
      group: issue2-evidence-writer
      cancel-in-progress: false
    if: always()
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: issue2-windows-results
          path: verification-artifacts/issue2-windows-results
      - name: Retain native outcome without waiting for portable suite
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_RESULT: not-yet-aggregated
          WINDOWS_RESULT: ${{ needs.windows.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/issue2-ci-evidence.py
