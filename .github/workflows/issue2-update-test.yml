name: Issue2.3 rebuild and prepublication verification (no publication)
on:
  push:
    branches: [codex/fix-preview40-bindings-adb, codex/recognition-diagnostics-20261102, codex/windows-image-display-20261103, codex/windows-image-display-public-20261104]
    paths:
      - '.github/workflows/issue2-update-test.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/issue2-ci-evidence.py'
      - 'testdata/issue2-redacted/**'
  workflow_dispatch:
env:
  MHX_BUSINESS_SOURCE: 461cac4f5436b0989b6b1af5e0a51b6fa32660ca
  MHX_TEST_VERSION: 3.5.0-preview.41-issue2.3
permissions:
  contents: read
concurrency:
  group: issue2-update-verification
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 -json ./... > portable-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2-portable-results
          path: portable-tests.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Build confirmed version from frozen business source
        shell: pwsh
        run: |
          git fetch --no-tags origin bfc5e2f0336ede93e963d364cac21fb1a2f15a43
          if ($LASTEXITCODE) { throw 'Cannot read published source' }
          git diff --exit-code bfc5e2f0336ede93e963d364cac21fb1a2f15a43 HEAD -- internal/studio
          if ($LASTEXITCODE) { throw 'Database schema changed; explicit migration acceptance required' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          $version = $env:MHX_TEST_VERSION
          $businessSource = $env:MHX_BUSINESS_SOURCE
          git fetch --no-tags origin $businessSource
          if ($LASTEXITCODE) { throw 'Frozen business source missing' }
          $runtimeDiff = @(git diff --name-only $businessSource HEAD -- cmd/mhxstudio internal go.mod go.sum | Where-Object { $_ -notmatch '_test[.]go$' })
          if ($LASTEXITCODE -or $runtimeDiff.Count -ne 0) { throw 'Business runtime differs from verified 461cac4' }
          $approvedPNG = (Get-FileHash testdata/issue2-redacted/screenshot.png -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($approvedPNG -ne 'e7e2e9436a79f2535e3955a3961e0317e5308672d9d8536ecab724aabc16444e') { throw 'Missing or unapproved PNG' }
          $candidateEXE = Join-Path $pwd 'dist/MHXStudio.exe'
          $businessDir = Join-Path $env:RUNNER_TEMP 'mhx-frozen-business-461cac4'
          git worktree add --detach $businessDir $businessSource
          if ($LASTEXITCODE) { throw 'Cannot isolate frozen business checkout' }
          Push-Location $businessDir
          try {
            go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$version -X main.sourceCommit=$businessSource" -o $candidateEXE ./cmd/mhxstudio
            if ($LASTEXITCODE) { throw 'Candidate build failed' }
          } finally { Pop-Location }
          go build -trimpath -ldflags '-H windowsgui -s -w' -o dist/exit-test.exe ./cmd/testexit
          if ($LASTEXITCODE) { throw 'Exit fixture build failed' }
          go build -trimpath -ldflags '-H windowsgui -s -w' -o dist/ldfixture.exe ./cmd/ldfixture
          if ($LASTEXITCODE) { throw 'Emulator fixture build failed' }
          go build -o dist/windowsverify.exe ./cmd/windowsverify
          if ($LASTEXITCODE) { throw 'Native verifier build failed' }
          $hash = (Get-FileHash dist/MHXStudio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version;source_commit=$businessSource;verification_commit=$env:GITHUB_SHA;sha256=$hash;size=(Get-Item dist/MHXStudio.exe).Length;isolated_test_id='';published=$false} | ConvertTo-Json | Set-Content -Encoding utf8 dist/candidate.json
          if ($hash -eq '0f70e2cc0c4c1cfb68f6e50f1ccf3b03ed33d2032d228adb4fea0df574697585') { throw 'Old GUI artifact reused' }
          $self = (& ./dist/MHXStudio.exe --self-test | ConvertFrom-Json)
          if ($LASTEXITCODE -or $self.version -ne $version -or $self.source_commit -ne $businessSource -or $self.os -ne 'windows' -or $self.arch -ne 'amd64') { throw 'Embedded metadata disagrees with build' }
          $self | ConvertTo-Json | Set-Content -Encoding utf8 dist/embedded-metadata.json
          @{schema_version=1;version=$version;platform='windows-amd64';download_url="https://github.com/ab393911/MHX-Studio-Updates/releases/download/issue2-v$version/MHXStudio.exe";sha256=$hash;size=(Get-Item dist/MHXStudio.exe).Length;source_commit=$businessSource;windows_game_tested=$false;notes='未发布候选：原图/标定显示与只读图标草稿诊断；不宣称实机修复。'} | ConvertTo-Json | Set-Content -Encoding utf8 dist/candidate-manifest.json
          "$hash  MHXStudio.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Verify published preview40 baseline
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/v3.5.0-preview.40/MHXStudio.exe' -OutFile dist/published40.exe
          if ((Get-FileHash dist/published40.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e58eaef41b4e37361f79cc500872bc89f1e7ebe37d810785740b294eb397daa2') { throw 'Published preview40 SHA mismatch' }
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/issue2-v3.5.0-preview.41-issue2.1/MHXStudio.exe' -OutFile dist/published41.exe
          if ((Get-FileHash dist/published41.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b7ac42b0800b96c4dd60a4245e31ebf054373675ae23702af4bb7ba978bf3cb7') { throw 'Published preview41 Issue2 SHA mismatch' }
      - name: Record published image baseline on actual screen pixels
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/ab393911/MHX-Studio-Updates/releases/download/issue2-v3.5.0-preview.41-issue2.2/MHXStudio.exe' -OutFile dist/published2.exe
          if ((Get-FileHash dist/published2.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '28a5f525f9df3c04d53818dc561cde21765c3850f7f3c5aea9182566daebd9a7') { throw 'Published issue2.2 SHA mismatch' }
          New-Item -ItemType Directory -Force dist/display-baseline | Out-Null
          Start-Transcript -Path dist/display-baseline/workflow.log | Out-Null
          $baselineOutput = & ./dist/windowsverify.exe -recognition-only -display-probe -new "$pwd/dist/published2.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.2' -out dist/display-baseline/recognition-tests.json 2>&1
          $baselineExit = $LASTEXITCODE
          Stop-Process -Name published2,dnplayer,adb,ldconsole -Force -ErrorAction SilentlyContinue
          $log = $baselineOutput | Out-String
          Set-Content -Encoding utf8 -Path dist/display-baseline/baseline.log -Value $log
          Write-Output $log
          $pixelFailure = $baselineExit -ne 0 -and $log -match '(calibration|original) [a-z0-9-]+: screen pixel mismatch'
          if ($baselineExit -ne 0 -and -not $pixelFailure) { throw 'Old baseline failed outside image pixel checks; inspect evidence' }
          @{reproduced=$pixelFailure;baseline_passed_on_ci=($baselineExit -eq 0);exit=$baselineExit;source_commit='25b5adcad0221cd3f6e1c90d569b8006ea4ebcc7';injection='RedrawWindow erase-now followed by normal message-loop repaint';exact_user_trigger_confirmed=$false} | ConvertTo-Json | Set-Content -Encoding utf8 dist/display-baseline/baseline-display.json
          Stop-Transcript | Out-Null
          $global:LASTEXITCODE = 0
      - name: Real GUI calibration save, pixel mapping, reload and read-only recognition
        id: recognition
        shell: pwsh
        run: |
          ./dist/windowsverify.exe -recognition-only -icon-draft-gui -display-probe -new "$pwd/dist/MHXStudio.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.3' -out dist/recognition-tests.json 2>&1 | Tee-Object -FilePath dist/recognition.log
          $recognitionExit = $LASTEXITCODE
          if ($recognitionExit) { Stop-Process -Name MHXStudio,dnplayer,adb,ldconsole -Force -ErrorAction SilentlyContinue; throw 'Calibration/recognition regression failed; publication remains blocked' }
      - name: Actual Windows desktop PNG display lifecycle and full pixel comparison
        id: screenpng
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/desktop-png | Out-Null
          ./dist/windowsverify.exe -recognition-only -display-probe -screen-png -new "$pwd/dist/MHXStudio.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.3' -out dist/desktop-png/recognition-tests.json 2>&1 | Tee-Object -FilePath dist/desktop-png/recognition.log
          if ($LASTEXITCODE) { Stop-Process -Name MHXStudio,dnplayer,adb,ldconsole -Force -ErrorAction SilentlyContinue; throw 'Actual PNG onscreen rendering regression failed' }
      - name: Approved redacted PNG GUI lifecycle (only when sample is present)
        id: redacted
        if: ${{ hashFiles('testdata/issue2-redacted/screenshot.png') != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/redacted-png | Out-Null
          ./dist/windowsverify.exe -recognition-only -display-probe -png-frame "$pwd/testdata/issue2-redacted/screenshot.png" -png-frame-kind redacted -new "$pwd/dist/MHXStudio.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -version '3.5.0-preview.41-issue2.3' -out dist/redacted-png/recognition-tests.json 2>&1 | Tee-Object -FilePath dist/redacted-png/recognition.log
          if ($LASTEXITCODE) { Stop-Process -Name MHXStudio,dnplayer,adb,ldconsole -Force -ErrorAction SilentlyContinue; throw 'Approved redacted PNG GUI regression failed' }
      - name: Native Windows static checks and unit tests
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE) { throw 'Windows vet failed' }
          go test -p 1 -count=1 -json -skip '^TestNativeWindowsAssetAmounts$' ./... > dist/windows-unit-tests.json
          if ($LASTEXITCODE) { throw 'Windows unit tests failed (experimental game currency fixture was not run)' }
      - name: Full native GUI and issue2.2 helper backups, rollback, one-click upgrade
        if: ${{ success() && steps.recognition.outcome == 'success' && steps.screenpng.outcome == 'success' && (steps.redacted.outcome == 'success' || steps.redacted.outcome == 'skipped') }}
        shell: pwsh
        run: |
          ./dist/windowsverify.exe -old "$pwd/dist/published2.exe" -old-version '3.5.0-preview.41-issue2.2' -new "$pwd/dist/MHXStudio.exe" -exit-fixture "$pwd/dist/exit-test.exe" -version '3.5.0-preview.41-issue2.3' -published-issue2-2 "$pwd/dist/published2.exe" -published40 "$pwd/dist/published40.exe" -published41 "$pwd/dist/published41.exe" -emulator-fixture "$pwd/dist/ldfixture.exe" -out dist/issue2-native-update.json 2>&1 | Tee-Object -FilePath dist/native-update.log
          $verifyExit = $LASTEXITCODE
          if ($verifyExit) { throw 'Native update acceptance failed; publication blocked' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2-windows-results
          path: |
            dist/candidate.json
            dist/candidate-manifest.json
            dist/embedded-metadata.json
            dist/SHA256SUMS.txt
            dist/windows-unit-tests.json
            dist/issue2-native-update.json
            dist/native-update.log
            dist/recognition-tests.json
            dist/recognition-export.zip
            dist/recognition.log
            dist/calibration-roundtrip.png
            dist/diagnostic-original-view.png
            dist/*-screen-*.png
            dist/display-baseline/
            dist/desktop-png/
            dist/redacted-png/
            dist/preview40-direct/
            dist/preview41-issue2/
            dist/preview41-issue2-2/
            dist/MHXStudio.exe
          if-no-files-found: error
      - name: Publish execution summary only
        if: always()
        shell: pwsh
        run: |
          "## Issue2 Windows verification" >> $env:GITHUB_STEP_SUMMARY
          foreach ($name in @('candidate.json','issue2-native-update.json','preview40-direct/upgrade.json')) {
            if (Test-Path "dist/$name") { "### $name" >> $env:GITHUB_STEP_SUMMARY; '```json' >> $env:GITHUB_STEP_SUMMARY; Get-Content "dist/$name" >> $env:GITHUB_STEP_SUMMARY; '```' >> $env:GITHUB_STEP_SUMMARY }
          }
  evidence:
    concurrency:
      group: issue2-evidence-writer
      cancel-in-progress: false
    if: always()
    needs: [portable, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: verification-artifacts
      - name: Persist reports only (no releases or channel changes)
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/issue2-ci-evidence.py

  windows-evidence:
    concurrency:
      group: issue2-evidence-writer
      cancel-in-progress: false
    if: always()
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: issue2-windows-results
          path: verification-artifacts/issue2-windows-results
      - name: Retain native outcome without waiting for portable suite
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_RESULT: not-yet-aggregated
          WINDOWS_RESULT: ${{ needs.windows.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/issue2-ci-evidence.py
